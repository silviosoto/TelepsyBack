trigger:
  paths:
    include:
      - Back/TelepsyBack/*
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest' # Windows is usually better for .NET Framework/SDK consistency unless you know it runs on Linux

variables:
  buildConfiguration: 'Release'
  solution: 'Back/TelepsyBack/TelePsy.slnx' # Azure DevOps supports .slnx if using modern .NET SDK
  project: 'Back/TelepsyBack/TelePsy.API/TelePsy.API.csproj'

steps:
- task: UseDotNet@2
  displayName: 'Use .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x' # Update this to match your actual .NET 10 (or 9, 8) version
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: 'Back/TelepsyBack/**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build API Project'
  inputs:
    command: 'build'
    projects: 'Back/TelepsyBack/**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run Unit Tests'
  inputs:
    command: 'test'
    projects: 'Back/TelepsyBack/**/*.Tests/*.csproj'
    arguments: '--configuration $(buildConfiguration) --collect "Code coverage"'

- task: DotNetCoreCLI@2
  displayName: 'Publish API Artifact'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(project)'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Upload Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'TelePsy_API_Drop'
    publishLocation: 'Container'
